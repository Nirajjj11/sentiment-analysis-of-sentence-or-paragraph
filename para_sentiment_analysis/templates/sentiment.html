{% extends 'index.html' %}
{% block content %}

<div class="container">
    <h1>This is the Sentiment. </h1>
    <div class="row">
        <div class="col-12">
            <form method="get">
                <div>
                    <label class="my-4" for="Sentence">
                        Enter the Sentence or paragraph
                    </label>
                    <input type="text" name="sentence" class="form-control" placeholder="Enter Your Sentence" required>
                    <button class="btn btn-success my-4" type="submit">Submit</button>
                </div>
            </form>
        </div>
        {% if sentence %}
        <h2>Score is : {{score}}</h2>
        <h2>{{result}}</h2>
        {% endif %}
    </div>
</div>


{% endblock %}
